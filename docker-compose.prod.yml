# 隔離開發環境
name: reader-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reader
      MYSQL_USER: reader
      MYSQL_PASSWORD: ${DB_PASSWORD:?請設定 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?請設定 DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci ${MYSQL_OPTS:-}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30

  reader:
    image: ${DOCKERHUB_USERNAME:-local}/reader:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/reader?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: reader
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LIMIT_LOGIN_ATTEMPTS: ${LIMIT_LOGIN_ATTEMPTS:-5}
      LIMIT_REGISTRATIONS: ${LIMIT_REGISTRATIONS:-3}
      LIMIT_MEMBER_DOWNLOADS: ${LIMIT_MEMBER_DOWNLOADS:-10}
      LIMIT_FREE_DOWNLOADS: ${LIMIT_FREE_DOWNLOADS:-1}
      LIMIT_DAILY_READ_BOOKS: ${LIMIT_DAILY_READ_BOOKS:-30}
      LIMIT_CHAPTERS_PER_MINUTE: ${LIMIT_CHAPTERS_PER_MINUTE:-60}
      # 記憶體調校
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:-}
      # 安全連線用
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-80}:8080"
    volumes:
      - book-data:/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  book-data:
