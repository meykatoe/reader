name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # 發布不中斷
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  backend:
    name: 後端測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  frontend:
    name: 前端建置
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    name: 整套啟動檢查
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # 僅測試用
      DB_PASSWORD: ci-password
      DB_ROOT_PASSWORD: ci-root-password
      WEB_PORT: '8088'
    steps:
      - uses: actions/checkout@v7
      - name: 啟動服務
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - name: 檢查回應
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/auth/me)" = 401
      - name: 輸出日誌
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200

  publish:
    name: 上傳映像 (${{ matrix.app }})
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/reader-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
