name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # 發布不中斷
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  backend:
    name: 後端測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  frontend:
    name: 前端建置
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    name: 整套啟動檢查
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # 僅測試用
      DB_PASSWORD: ci-password
      DB_ROOT_PASSWORD: ci-root-password
      WEB_PORT: '8088'
    steps:
      - uses: actions/checkout@v7
      - name: 啟動服務
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - name: 檢查回應
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/auth/me)" = 401
      - name: 輸出日誌
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200

  publish:
    name: 上傳映像
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/reader
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 更新伺服器
    needs: publish
    # 沒主機就略過
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_NAME: ${{ vars.DEPLOY_USER }}
      TARGET: ${{ vars.DEPLOY_PATH }}
      IMAGE_OWNER: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: 設定金鑰
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 拉取並重啟
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          scp docker-compose.prod.yml "$USER_NAME@$HOST:$TARGET/"
          ssh "$USER_NAME@$HOST" "cd '$TARGET' \
            && export DOCKERHUB_USERNAME='$IMAGE_OWNER' IMAGE_TAG='$TAG' \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --no-build --wait --remove-orphans \
            && sed -i '/^IMAGE_TAG=/d' .env && sed -i '\$aIMAGE_TAG=$TAG' .env"
