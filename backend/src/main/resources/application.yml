server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  tomcat:
    # 超大檔回應
    max-swallow-size: -1
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: reader
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/reader?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:reader}
    password: ${DB_PASSWORD:reader}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
reader:
  storage:
    root: ${STORAGE_ROOT:../data}
