server:
  port: 8080
  # 讀取真實來源
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  tomcat:
    # 超大檔回應
    max-swallow-size: -1
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: reader
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/reader?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:reader}
    password: ${DB_PASSWORD:reader}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
reader:
  limits:
    login-attempts: ${LIMIT_LOGIN_ATTEMPTS:5}
    registrations: ${LIMIT_REGISTRATIONS:3}
    member-downloads: ${LIMIT_MEMBER_DOWNLOADS:10}
    free-downloads: ${LIMIT_FREE_DOWNLOADS:1}
    daily-read-books: ${LIMIT_DAILY_READ_BOOKS:30}
    chapters-per-minute: ${LIMIT_CHAPTERS_PER_MINUTE:60}
  storage:
    root: ${STORAGE_ROOT:../data}
    # 本機或物件
    type: ${STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
